<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voidpass Reset Password</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background:#0b0f1a; color:#e6e6e6; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin: 12px 0; }
    label { display:block; font-size: 12px; opacity: 0.85; margin: 10px 0 6px; }
    input { width: 100%; padding: 12px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; color: #e6e6e6; outline: none; }
    button { cursor:pointer; }
    .btn { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(120,255,200,0.25); background: rgba(120,255,200,0.10); color:#e6e6e6; font-weight: 700; }
    .btn2 { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(120,180,255,0.25); background: rgba(120,180,255,0.10); color:#e6e6e6; font-weight: 700; margin-top: 10px; }
    .pill { display:inline-block; padding: 6px 10px; border-radius: 999px; font-size: 12px; border: 1px solid rgba(255,255,255,0.10); }
    .pill.ok { border-color: rgba(120,255,200,0.35); background: rgba(120,255,200,0.10); }
    .pill.bad { border-color: rgba(255,120,120,0.35); background: rgba(255,120,120,0.10); }
    .muted { opacity: .8; font-size: 12px; line-height: 1.35; }
    pre { white-space: pre-wrap; word-break: break-word; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="display:flex; justify-content: space-between; align-items:center; gap:12px;">
        <div>
          <strong>VOIDPASS — RESET PASSWORD</strong>
          <div class="muted">This page only works from a Supabase password-recovery link.</div>
        </div>
        <span id="statusPill" class="pill bad">Not ready</span>
      </div>
    </div>

    <div class="card">
      <div class="muted" id="statusText">
        Waiting for recovery session…
      </div>

      <div id="formBox" style="display:none;">
        <label style="margin-top:12px;">New password</label>
        <input id="pw1" type="password" autocomplete="new-password" />

        <label>Confirm new password</label>
        <input id="pw2" type="password" autocomplete="new-password" />

        <button id="setPw" class="btn" style="margin-top:12px;">Set new password</button>
        <button id="goDoor" class="btn2" style="display:none;">Go to Door</button>

        <div class="muted" style="margin-top:10px;">
          Minimum 8 characters recommended. Use something unique.
        </div>
      </div>

      <pre id="out" style="display:none;">{}</pre>
    </div>
  </div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Must match your existing door.html values
  const SUPABASE_URL = "https://xhitzrnmowqeaerofion.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoaXR6cm5tb3dxZWEycmVvZmlvbiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzM1NjU2NTI2LCJleHAiOjIwODE4MjI5MjZ9.rMRAn3-3afUE4HEA4-RJ8ZB7jiqUVY9_ItU_2461Mvk";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true } // important for recovery links
  });

  const statusPill = document.getElementById("statusPill");
  const statusText = document.getElementById("statusText");
  const formBox = document.getElementById("formBox");
  const out = document.getElementById("out");
  const goDoor = document.getElementById("goDoor");

  const pw1 = document.getElementById("pw1");
  const pw2 = document.getElementById("pw2");

  function setStatus(ok, text) {
    statusPill.className = "pill " + (ok ? "ok" : "bad");
    statusPill.textContent = ok ? "Ready" : "Not ready";
    statusText.textContent = text;
  }

  function showDebug(obj) {
    out.style.display = "";
    out.textContent = JSON.stringify(obj, null, 2);
  }

  // Attempt to exchange code for session (PKCE links)
  async function tryExchangeCode() {
    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");
    if (!code) return;

    const { data, error } = await supabase.auth.exchangeCodeForSession(code);
    if (error) {
      showDebug({ stage: "exchangeCodeForSession", error: error.message });
    } else {
      showDebug({ stage: "exchangeCodeForSession", ok: true, data });
    }
  }

  async function loadRecoverySession() {
    // Some reset links deliver "code" param; others deliver tokens in hash.
    await tryExchangeCode();

    const { data, error } = await supabase.auth.getSession();
    if (error) {
      setStatus(false, "Error checking session.");
      showDebug({ stage: "getSession", error: error.message });
      return null;
    }

    const session = data?.session ?? null;
    if (!session) {
      setStatus(false, "No recovery session found. Open the password reset email link again.");
      return null;
    }

    // If we have any session at all, allow password update.
    setStatus(true, "Recovery session detected. Set a new password below.");
    formBox.style.display = "";
    return session;
  }

  document.getElementById("setPw").onclick = async () => {
    const a = String(pw1.value || "");
    const b = String(pw2.value || "");

    if (a.length < 8) {
      setStatus(false, "Password too short (minimum 8 characters).");
      return;
    }
    if (a !== b) {
      setStatus(false, "Passwords do not match.");
      return;
    }

    setStatus(true, "Setting password…");

    const { data, error } = await supabase.auth.updateUser({ password: a });
    if (error) {
      setStatus(false, "Failed to set password.");
      showDebug({ stage: "updateUser", error: error.message });
      return;
    }

    // Sign out so the recovery session doesn't linger on a shared device.
    await supabase.auth.signOut();

    setStatus(true, "Password updated. You can now sign in normally.");
    showDebug({ stage: "updateUser", ok: true, data });

    goDoor.style.display = "";
    goDoor.onclick = () => {
      window.location.href = "./door.html";
    };
  };

  // Start
  loadRecoverySession();
</script>
</body>
</html>
