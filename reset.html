<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voidpass Reset Password</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background:#0b0f1a; color:#e6e6e6; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin: 12px 0; }
    label { display:block; font-size: 12px; opacity: 0.85; margin: 10px 0 6px; }
    input { width: 100%; padding: 12px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; color: #e6e6e6; outline: none; }
    button { cursor:pointer; }
    .btn { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(120,255,200,0.25); background: rgba(120,255,200,0.10); color:#e6e6e6; font-weight: 700; }
    .btn2 { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(120,180,255,0.25); background: rgba(120,180,255,0.10); color:#e6e6e6; font-weight: 700; margin-top: 10px; }
    .pill { display:inline-block; padding: 6px 10px; border-radius: 999px; font-size: 12px; border: 1px solid rgba(255,255,255,0.10); }
    .pill.ok { border-color: rgba(120,255,200,0.35); background: rgba(120,255,200,0.10); }
    .pill.bad { border-color: rgba(255,120,120,0.35); background: rgba(255,120,120,0.10); }
    .muted { opacity: .8; font-size: 12px; line-height: 1.35; }
    pre { white-space: pre-wrap; word-break: break-word; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="display:flex; justify-content: space-between; align-items:center; gap:12px;">
        <div>
          <strong>VOIDPASS — RESET PASSWORD</strong>
          <div class="muted">Open this page ONLY via the password reset email link.</div>
        </div>
        <span id="statusPill" class="pill bad">Not ready</span>
      </div>
      <div class="muted" id="statusText" style="margin-top:10px;">Waiting for recovery token…</div>
    </div>

    <div class="card" id="formBox" style="display:none;">
      <label>New password</label>
      <input id="pw1" type="password" autocomplete="new-password" />

      <label>Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" />

      <button id="setPw" class="btn" style="margin-top:12px;">Set new password</button>
      <button id="goDoor" class="btn2" style="display:none;">Go to Door</button>

      <div class="muted" style="margin-top:10px;">
        If you see “Not ready”, the recovery link arrived without usable tokens.
      </div>
    </div>

    <div class="card">
      <strong>Debug (safe)</strong>
      <div class="muted">Shows which token fields arrived (values are not displayed).</div>
      <pre id="debug">{}</pre>
    </div>
  </div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://xhitzrnmowqeaerofion.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoaXR6cm5tb3dxZWEycmVvZmlvbiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzM1NjU2NTI2LCJleHAiOjIwODE4MjI5MjZ9.rMRAn3-3afUE4HEA4-RJ8ZB7jiqUVY9_ItU_2461Mvk";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true }
  });

  // For console inspection only
  window.supabase = supabase;

  const statusPill = document.getElementById("statusPill");
  const statusText = document.getElementById("statusText");
  const formBox = document.getElementById("formBox");
  const debug = document.getElementById("debug");
  const goDoor = document.getElementById("goDoor");

  const pw1 = document.getElementById("pw1");
  const pw2 = document.getElementById("pw2");

  function setStatus(ok, text) {
    statusPill.className = "pill " + (ok ? "ok" : "bad");
    statusPill.textContent = ok ? "Ready" : "Not ready";
    statusText.textContent = text;
  }

  function safeDebug(obj) {
    debug.textContent = JSON.stringify(obj, null, 2);
  }

  function parseHash() {
    const u = new URL(window.location.href);
    const hash = new URLSearchParams((u.hash || "").replace(/^#/, ""));
    return {
      type_hash: hash.get("type") || null,
      has_access_token_hash: !!hash.get("access_token"),
      has_refresh_token_hash: !!hash.get("refresh_token"),
      // do NOT display token values
    };
  }

  function parseQuery() {
    const u = new URL(window.location.href);
    return {
      has_code: !!u.searchParams.get("code"),
      has_token_hash: !!u.searchParams.get("token_hash"),
      type_qs: u.searchParams.get("type") || null
    };
  }

  async function establishSessionIfNeeded() {
    // If supabase didn't detect it, we force setSession from hash tokens for recovery links
    const u = new URL(window.location.href);
    const hash = new URLSearchParams((u.hash || "").replace(/^#/, ""));
    const type = hash.get("type");

    const access_token = hash.get("access_token");
    const refresh_token = hash.get("refresh_token");

    if (type === "recovery" && access_token && refresh_token) {
      const { data, error } = await supabase.auth.setSession({ access_token, refresh_token });
      if (error) return { ok:false, stage:"setSession", error:error.message };
      return { ok:true, stage:"setSession", data_present: !!data?.session };
    }

    return { ok:true, stage:"no_force_needed" };
  }

  async function waitForSession() {
    for (let i = 0; i < 12; i++) {
      const { data, error } = await supabase.auth.getSession();
      if (error) return { ok:false, stage:"getSession", error:error.message };
      if (data?.session) return { ok:true, session: data.session };
      await new Promise(r => setTimeout(r, 250));
    }
    return { ok:false, stage:"waitForSession", error:"No session detected" };
  }

  async function main() {
    const dbg = { url_tokens_present: { ...parseQuery(), ...parseHash() } };
    safeDebug(dbg);

    // First, try to force session from hash if needed
    const forced = await establishSessionIfNeeded();
    if (!forced.ok) {
      setStatus(false, "Recovery link detected but failed to establish session.");
      safeDebug({ ...dbg, establish_error: forced });
      return;
    }

    const got = await waitForSession();
    if (!got.ok) {
      setStatus(false, "No recovery session found. Click a fresh reset email link (do not copy/paste).");
      safeDebug({ ...dbg, session_error: got, establish: forced });
      return;
    }

    setStatus(true, "Recovery session detected. Set a new password below.");
    formBox.style.display = "";
  }

  document.getElementById("setPw").onclick = async () => {
    const a = String(pw1.value || "");
    const b = String(pw2.value || "");

    if (a.length < 8) { setStatus(false, "Password too short (min 8)."); return; }
    if (a !== b) { setStatus(false, "Passwords do not match."); return; }

    setStatus(true, "Setting password…");

    const { error } = await supabase.auth.updateUser({ password: a });
    if (error) {
      setStatus(false, "Failed to set password.");
      safeDebug({ ...JSON.parse(debug.textContent || "{}"), update_error: error.message });
      return;
    }

    await supabase.auth.signOut();
    setStatus(true, "Password updated. You can now sign in normally.");
    goDoor.style.display = "";
    goDoor.onclick = () => window.location.href = "./door.html";
  };

  main();
</script>
</body>
</html>
